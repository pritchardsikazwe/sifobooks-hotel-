name: SifoBooks Hotel Desktop and Android Builds

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        type: choice
        options:
          - all
          - windows
          - android-apk
          - android-aab
  push:
    branches: [main, gracesoft-ui-rollout]
    tags:
      - "hotel-v*"

permissions:
  contents: write

jobs:
  windows:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - name: Generate Windows app icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/icons | Out-Null
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 256,256
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::FromArgb(9,43,70))
          $font = New-Object System.Drawing.Font("Arial", 116, [System.Drawing.FontStyle]::Bold, [System.Drawing.GraphicsUnit]::Pixel)
          $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(237,187,81))
          $g.DrawString("S", $font, $brush, 62, 48)
          $icon = [System.Drawing.Icon]::FromHandle($bmp.GetHicon())
          $stream = [System.IO.File]::Create("src-tauri/icons/icon.ico")
          $icon.Save($stream); $stream.Close()
          $g.Dispose(); $bmp.Dispose(); $font.Dispose(); $brush.Dispose()
      - name: Build native Windows installer
        run: npm run tauri:build
      - name: Prepare direct-download Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer .exe was not generated.' }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item $installer.FullName release/SifoBooksHotelSetup.exe -Force
      - name: Package Windows ZRA connector agent
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          npm run connector:build
      - uses: actions/upload-artifact@v4
        with:
          name: sifobooks-hotel-windows-installers
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: sifobooks-hotel-zra-connector
          path: release/HotelZraConnector.exe
          if-no-files-found: error
      - name: Publish direct-download release
        if: startsWith(github.ref, 'refs/tags/hotel-v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/SifoBooksHotelSetup.exe
          generate_release_notes: true

  android:
    if: (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'android-apk' || inputs.target == 'android-aab')) || (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/hotel-v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/gracesoft-ui-rollout'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - run: npm install
      - run: npm run build
      - name: Create Android project and sync web app
        run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'android-apk'
        run: cd android && ./gradlew assembleDebug
      - name: Build release AAB (unsigned unless signing secrets are configured)
        if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'android-aab'
        run: cd android && ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'android-apk'
        with:
          name: sifobooks-hotel-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'android-aab'
        with:
          name: sifobooks-hotel-android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
