name: SifoBooks Hotel Desktop and Android Builds

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        type: choice
        options:
          - all
          - windows
          - android-apk
          - android-aab
  push:
    tags:
      - "hotel-v*"

permissions:
  contents: read

jobs:
  windows:
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - name: Build native Windows installers
        run: npm run tauri:build
      - uses: actions/upload-artifact@v4
        with:
          name: sifobooks-hotel-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  android:
    if: (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'android-apk' || inputs.target == 'android-aab')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/hotel-v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npm run build
      - name: Create Android project and sync web app
        run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'android-apk'
        run: cd android && ./gradlew assembleDebug
      - name: Build release AAB (unsigned unless signing secrets are configured)
        if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'android-aab'
        run: cd android && ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'android-apk'
        with:
          name: sifobooks-hotel-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'android-aab'
        with:
          name: sifobooks-hotel-android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
