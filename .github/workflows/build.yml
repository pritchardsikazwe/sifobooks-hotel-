name: Hotel Product Build

concurrency:
  group: hotel-product-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, '**']
    paths:
      - ".github/workflows/hotel-product-check.yml"
  pull_request:
    paths:
      - "products/hotel/**"
      - ".github/workflows/hotel-product-check.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install
      - name: Build standalone Hotel app
        run: npm run build
