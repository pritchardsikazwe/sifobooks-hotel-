name: SifoBooks Hotel Build

concurrency:
  group: hotel-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "src/**"
      - "tsconfig.json"
      - "vite.config.ts"
      - "supabase/migrations/**"
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "src/**"
      - "tsconfig.json"
      - "vite.config.ts"
      - "supabase/migrations/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check and build
        run: npm run build
