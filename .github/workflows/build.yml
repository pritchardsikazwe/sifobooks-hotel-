name: SifoBooks Hotel Build and Smoke Check

concurrency:
  group: hotel-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, gracesoft-ui-rollout, signed-in-dashboard-reference]
    paths:
      - ".github/workflows/build.yml"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "src/**"
      - "public/**"
      - "tsconfig.json"
      - "vite.config.ts"
      - "supabase/migrations/**"
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "src/**"
      - "public/**"
      - "tsconfig.json"
      - "vite.config.ts"
      - "supabase/migrations/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check and build
        run: npm run build
      - name: Verify production output
        run: |
          test -s dist/index.html
          test -d dist/assets
          find dist/assets -maxdepth 1 -type f -name '*.js' -print -quit | grep -q .
          find dist/assets -maxdepth 1 -type f -name '*.css' -print -quit | grep -q .
          grep -q 'startup-guard' dist/index.html
          echo "Production output and startup recovery screen verified."
