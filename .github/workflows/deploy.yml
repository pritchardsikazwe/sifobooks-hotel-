name: Deploy SifoBooks Hotel

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy.yml"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "src/**"
      - "public/**"
      - "tsconfig.json"
      - "vite.config.ts"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hotel-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build app
        run: npm run build
      - name: Verify production output
        run: |
          test -s dist/index.html
          test -d dist/assets
          find dist/assets -maxdepth 1 -type f -name '*.js' -print -quit | grep -q .
          find dist/assets -maxdepth 1 -type f -name '*.css' -print -quit | grep -q .
          grep -q 'startup-guard' dist/index.html
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live website responds
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error https://hotel.sifobooks.com/ -o /tmp/hotel-home.html; then
              grep -q 'startup-guard' /tmp/hotel-home.html && exit 0
            fi
            sleep 10
          done
          echo "Live website did not return the expected startup-protected HTML."
          exit 1
